name: Deploy to Vercel

# Manual deployments only: run from the Actions tab via "Run workflow"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel environment to deploy to"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-tracker-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: job-tracker-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (CI check)
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Remote build on Vercel infra (same path as dashboard/Git deploys).
      # Deliberately NOT using `vercel build` + `--prebuilt` here: the CLI's
      # local build sandbox prunes devDependencies, so `vite build` fails
      # with "vite: not found" (exit 127). The "Build (CI check)" step above
      # already validates the production build locally.
      # Requires VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY to be set in the
      # Vercel project for the target environment.
      # NOTE: this step runs from the repo ROOT, not job-tracker-app/.
      # The Vercel project has Root Directory = job-tracker-app, and the CLI
      # appends that to the cwd — running from inside job-tracker-app/
      # doubles the path (job-tracker-app/job-tracker-app) and fails with
      # "The provided path ... does not exist".
      - name: Deploy to Vercel
        working-directory: ${{ github.workspace }}
        run: vercel deploy ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
